[package]
name = "meshdoc-relay"
version = "0.1.0"
edition = "2021"
description = "MeshDoc relay: a dumb, untrusted store-and-forward mailbox for opaque encrypted blobs"
license = "MIT OR Apache-2.0"

[lib]
name = "meshdoc_relay"
path = "src/lib.rs"

[[bin]]
name = "meshdoc-relay"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
